# ERPNext local lab adapted from frappe/frappe_docker's production compose
# (NOT the disposable pwd.yml, per research.md). Versions pinned via
# infra/.env: ERPNext v15.47.0, MariaDB 10.6 (10.6.28), chosen in Fase 3
# because MariaDB >=10.6 fully supports GTID and v15 is the actively
# maintained ERPNext release line at the time of this project.
#
# Services:
# - mariadb-primary / mariadb-replica: two independent MariaDB instances,
#   each with its own named volume (never shared), connected through the
#   private "erpnext-net" network. GTID replication is configured by
#   scripts/setup-replication.sh (User Story 2), not by this file.
# - redis-cache / redis-queue: in-memory cache and job queue required by
#   every Frappe/ERPNext process.
# - configurator: one-shot service that writes db/redis connection settings
#   into sites/common_site_config.json, then exits.
# - create-site: one-shot service that creates the lab Frappe site once the
#   configurator has finished and MariaDB/Redis are reachable.
# - backend: the Frappe/ERPNext application server (gunicorn), the only
#   service that talks to MariaDB on behalf of the web app in normal
#   operation.
# - frontend: nginx reverse proxy, the only service published to the host
#   (so the administrator can open ERPNext in a browser).
# - websocket / queue-short / queue-long / scheduler: background workers
#   required by ERPNext (real-time updates, async jobs, scheduled tasks).
services:
  mariadb-primary:
    image: mariadb:${MARIADB_VERSION:-10.6}
    container_name: omnia-mariadb-primary
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      # Dedicated volume: never shared with mariadb-replica (FR-003).
      - mariadb-primary-data:/var/lib/mysql
      - ./mariadb-primary/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-replica:
    image: mariadb:${MARIADB_VERSION:-10.6}
    container_name: omnia-mariadb-replica
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      # Dedicated volume: never shared with mariadb-primary (FR-003).
      - mariadb-replica-data:/var/lib/mysql
      - ./mariadb-replica/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mariadb-primary:
        condition: service_healthy

  redis-cache:
    image: redis:6.2-alpine
    container_name: omnia-redis-cache
    networks:
      - erpnext-net
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    container_name: omnia-redis-queue
    networks:
      - erpnext-net
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-configurator
    networks:
      - erpnext-net
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      # ERPNext talks to mariadb-primary only; the replica is never a
      # direct target of application traffic in normal operation (FR-006
      # only changes this manually, during a mirror switch).
      DB_HOST: mariadb-primary
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      mariadb-primary:
        condition: service_healthy

  create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-create-site
    networks:
      - erpnext-net
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 mariadb-primary:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$MARIADB_ROOT_PASSWORD --install-app erpnext --set-default $$SITE_NAME;
        fi;
    environment:
      SITE_NAME: ${SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-backend
    networks:
      - erpnext-net
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-websocket
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-queue-short
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-queue-long
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-scheduler
    networks:
      - erpnext-net
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: omnia-erpnext-frontend
    networks:
      - erpnext-net
    restart: unless-stopped
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      # Only this service is published to the host: the ERPNext web UI.
      # MariaDB (primary and replica) is never published; it is only
      # reachable from the host via `docker compose exec` (see
      # contracts/operational-checks.md), keeping the DB network private.
      - "${HTTP_PUBLISH_PORT:-8080}:8080"

networks:
  erpnext-net:
    name: omnia-erpnext-net
    driver: bridge

volumes:
  mariadb-primary-data:
  mariadb-replica-data:
  redis-queue-data:
  sites:
  logs:
